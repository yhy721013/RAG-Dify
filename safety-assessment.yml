            "desc": "阶段D候选；实际运行验收前不发布",
            "selected": false,
            "code_language": "python3",
            "code": "import json\ndef main(status_code, body):\n    data = json.loads(body)\n    if status_code != 200 or data.get(\"status\") != \"ok\":\n        raise ValueError(\"证据服务未就绪，禁止继续\")\n    return {\"ready\": True}\n",
            "variables": [
